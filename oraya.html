  <script>
  const images = Array.from(document.querySelectorAll(".slides-grid .slide-item img"));

  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightboxImg");
  const btnClose = document.getElementById("lbClose");
  const btnPrev = document.getElementById("lbPrev");
  const btnNext = document.getElementById("lbNext");

  let index = -1;

  function openAt(i){
    index = i;
    lbImg.src = images[index].src;
    lb.classList.add("is-open");
    lb.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function close(){
    lb.classList.remove("is-open");
    lb.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    lbImg.src = "";
    index = -1;
  }

  function prev(){
    if (images.length === 0) return;
    index = (index - 1 + images.length) % images.length;
    lbImg.src = images[index].src;
  }

  function next(){
    if (images.length === 0) return;
    index = (index + 1) % images.length;
    lbImg.src = images[index].src;
  }

  // clic sur une miniature
  images.forEach((img, i) => {
    img.addEventListener("click", () => openAt(i));
  });

  // fermer
  btnClose.addEventListener("click", close);

  // clic sur le fond = fermer (mais pas quand on clique sur l'image)
  lb.addEventListener("click", (e) => {
    if (e.target === lb) close();
  });

  // navigation
  btnPrev.addEventListener("click", prev);
  btnNext.addEventListener("click", next);

  // clavier
  document.addEventListener("keydown", (e) => {
    if (!lb.classList.contains("is-open")) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") prev();
    if (e.key === "ArrowRight") next();
  });
</script>


  <button id="backToTop" aria-label="Retour en haut">↑</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menuIcon = document.querySelector('.menu-icon');
      const mobileMenu = document.getElementById('mobileMenu');

      if (menuIcon && mobileMenu) {
        menuIcon.addEventListener('click', () => {
          mobileMenu.style.display =
            mobileMenu.style.display === 'block' ? 'none' : 'block';
        });

        mobileMenu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            mobileMenu.style.display = 'none';
          });
        });
      }

      const backToTop = document.getElementById("backToTop");
      if (backToTop) {
        const toggle = () => {
          backToTop.style.display = window.scrollY > 100 ? "flex" : "none";
        };

        toggle();
        window.addEventListener("scroll", toggle, { passive: true });

        backToTop.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    });
  </script>
